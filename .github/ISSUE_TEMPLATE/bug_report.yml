name: Bug report
description: Report a reproducible problem in Intent.
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Version or commit, placeholder: 'v0.x or full commit SHA'}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Environment, description: 'OS, browser, deployment method, PostgreSQL/Redis versions. Omit secrets.'}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Steps to reproduce, description: Provide the smallest reproducible sequence.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected and actual behavior}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Relevant logs or screenshots, description: Remove credentials and personal information.}
